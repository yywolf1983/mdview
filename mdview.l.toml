# mdview 基础配置文件
# 启动方式：mdview --config mdview.toml --addr 0.0.0.0:9880

# 监听地址（可选；命令行 --addr 优先于此处）
addr = "0.0.0.0:9881"

# 访问密码：把下方占位符改成你自己的密码即可启用密码保护
# 留空（或删除下面这一行） = 无需登录直接访问
password = "isme"

# 可浏览目录（可配置多个，每个 [[dirs]] 一项）
# path 支持绝对路径或相对路径（相对 mdview 启动时的当前目录）

[[dirs]]
name = "notes"
path = "/Users/yy/aaa/yy/notes"

[[dirs]]
name = "yy"
path = "/Users/yy/aaa/yy"

[[dirs]]
name = "blog"
path = "/Users/yy/aaa/blog"
