<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{TITLE}</title>
<style>
{CSS}
</style>
<script>
{SCRIPT}
</script>
</head>
<body>
<div class="shell">
  <header class="site-header">
    <div class="site-header-main">
      <h1><span class="logo">📖</span>{TITLE}</h1>
      <div class="breadcrumb">{BREADCRUMB}</div>
    </div>
    <div class="site-header-side">
      {DIRSWITCH}
    </div>
  </header>
  {TOOLBAR}
  <div class="md-body">
    {BODY}
  </div>
</div>

<!-- 全局删除确认弹窗 -->
<div id="delete-modal" class="modal-mask hidden" role="dialog" aria-modal="true" aria-labelledby="del-title">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-icon" aria-hidden="true">⚠</div>
      <div style="flex:1;min-width:0">
        <h3 class="modal-title" id="del-title">确认删除</h3>
        <p class="modal-desc" data-modal-desc>您即将删除以下内容，此操作无法撤销，确定继续吗？</p>
        <span class="modal-target" data-modal-target>—</span>
      </div>
    </div>
    <div class="modal-foot">
      <button type="button" class="ghost" data-modal-cancel>取消</button>
      <button type="button" class="danger" data-modal-confirm>🗑 确认删除</button>
    </div>
  </div>
</div>

<!-- 全局重命名弹窗 -->
<div id="rename-modal" class="modal-mask hidden" role="dialog" aria-modal="true" aria-labelledby="ren-title">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-icon" aria-hidden="true">✏</div>
      <div style="flex:1;min-width:0">
        <h3 class="modal-title" id="ren-title">重命名</h3>
        <p class="modal-desc">请输入新的文件 / 目录名称：</p>
      </div>
    </div>
    <div class="modal-body">
      <input type="text" id="rename-input" class="rename-input" placeholder="新名称" autocomplete="off" spellcheck="false">
      <p class="modal-err hidden" data-rename-err></p>
    </div>
    <div class="modal-foot">
      <button type="button" class="ghost" data-rename-cancel>取消</button>
      <button type="button" class="primary" data-rename-confirm>✏ 确认重命名</button>
    </div>
  </div>
</div>

<!-- 全局新建弹窗 -->
<div id="new-modal" class="modal-mask hidden" role="dialog" aria-modal="true" aria-labelledby="new-title">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-icon" aria-hidden="true">＋</div>
      <div style="flex:1;min-width:0">
        <h3 class="modal-title" id="new-title">新建文件 / 目录</h3>
        <p class="modal-desc" id="new-parent-desc">将创建在当前目录</p>
      </div>
    </div>
    <form id="new-form" class="modal-body new-modal-body" method="post" action="/api/new">
      <input type="hidden" name="parent" id="new-parent" value="">
      <input type="text" name="name" id="new-name" class="new-input" placeholder="输入名称（文件自动追加 .md）" autocomplete="off" spellcheck="false" required>
      <label class="check">
        <input type="checkbox" name="is_dir" value="true"> 作为目录创建
      </label>
      <p class="modal-err hidden" data-new-err></p>
    </form>
    <div class="modal-foot">
      <button type="button" class="ghost" data-new-cancel>取消</button>
      <button type="button" class="primary" data-new-confirm>＋ 创建</button>
    </div>
  </div>
</div>

<!-- MathJax 数学公式渲染（仅识别 \( \) 与 \[ \] 分隔符，正文里的 $ 不会被误处理） -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)']],
      displayMath: [['\\[', '\\]']]
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    },
    svg: { fontCache: 'global' }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

</body>
</html>
