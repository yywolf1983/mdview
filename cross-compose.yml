# ============================================================
#  podman-compose 交叉编译编排（最终稳定版 · 无 bash 语法冲突）
# ------------------------------------------------------------
#  关键修正：
#  1. command 不再内联复杂 bash（避免 podman-compose 解析 ${} 报错）
#  2. 所有 bash 数组 / 插值语法移到 cross-build.sh
#  3. TARGETS: "${TARGETS:-}" 允许 run -e 覆盖
#  4. platform: linux/arm64 保证 M 芯片原生运行
#
#  用法：
#    podman-compose -f cross-compose.yml run --rm build
#    podman-compose -f cross-compose.yml run --rm \
#      -e TARGETS="aarch64-unknown-linux-musl x86_64-unknown-linux-musl x86_64-pc-windows-gnu" \
#      build
# ============================================================
services:
  build:
    build:
      context: .
      dockerfile: cross.Dockerfile
      platform: linux/arm64
    image: mdview-cross:latest
    container_name: mdview-cross
    volumes:
      - ./:/app:z
      - ./dist:/out:z
      - cargo-registry:/usr/local/cargo/registry
    environment:
      # 默认单目标
      TARGET: "aarch64-unknown-linux-musl"
      # 多目标（关键：允许 podman-compose run -e 覆盖）
      TARGETS: "${TARGETS:-}"

      # aarch64 原生（musl-gcc）
      CC_aarch64_unknown_linux_musl: "musl-gcc"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: "musl-gcc"

      # x86_64 musl（zigbuild）
      # Windows（mingw）
      CC_x86_64_pc_windows_gnu: "x86_64-w64-mingw32-gcc"
      CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: "x86_64-w64-mingw32-gcc"

      # 启用 zigbuild（处理含 C 依赖的 musl 目标）
      USE_ZIGBUILD: "1"

    # ✅ 关键：只调用脚本，不写复杂 bash
    command: ["/app/cross-build.sh"]

volumes:
  cargo-registry:
