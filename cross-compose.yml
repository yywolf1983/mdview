# 用 podman-compose 做 musl 交叉编译（本地 macOS 跑，产出 Linux 静态二进制）
#
# 用法：
#   # 默认编 x86_64 静态二进制
#   podman-compose -f cross-compose.yml run --rm build
#
#   # 编 arm64（aarch64）静态二进制
#   podman-compose -f cross-compose.yml run --rm -e TARGET=aarch64-unknown-linux-musl build
#
#   # 同时编多个目标
#   podman-compose -f cross-compose.yml run --rm -e TARGETS="x86_64-unknown-linux-musl aarch64-unknown-linux-musl" build
#
# 产物输出到宿主 ./dist/ 目录

services:
  build:
    build:
      context: .
      dockerfile: cross.Dockerfile
    image: mdview-cross:latest
    container_name: mdview-cross
    # 把宿主源码挂进容器（避免每次重建镜像）
    volumes:
      - ./:/app:z
      - ./dist:/out:z          # 编译产物落盘到宿主 dist/
      - cargo-registry:/usr/local/cargo/registry   # 缓存 crate，加速重复构建
    environment:
      # 单目标（覆盖默认 x86_64）；与 TARGETS 二选一
      TARGET: "x86_64-unknown-linux-musl"
      # 多目标（空格分隔）；设置后优先于 TARGET
      TARGETS: ""
      # 静态链接 musl 的 C 依赖（如 future openssl），无需也可留空
      CC_x86_64_unknown_linux_musl: "musl-gcc"
      CC_aarch64_unknown_linux_musl: "aarch64-linux-gnu-gcc"
    # 覆盖默认 CMD：根据 TARGETS / TARGET 编译并拷贝产物
    command:
      - bash
      - -lc
      - |
        set -e
        if [ -n "$TARGETS" ]; then
          for t in $TARGETS; do
            rustup target add "$t"
            cargo build --release --target "$t"
            cp "target/$t/release/mdview" "/out/mdview-$(echo $t | cut -d- -f1)"
          done
        else
          rustup target add "$TARGET"
          cargo build --release --target "$TARGET"
          cp "target/$TARGET/release/mdview" "/out/mdview-$(echo $TARGET | cut -d- -f1)"
        fi
        echo "=== 产物 ==="
        ls -lh /out

volumes:
  cargo-registry:
